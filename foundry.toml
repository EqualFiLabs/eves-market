[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [
	{ access = "read", path = "out/conditional-tokens" },
	{ access = "read-write", path = "cache" },
	{ access = "read-write", path = "deployments" }
]
remappings = [
	"@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
	"@statics/=lib/statics/src/",
	"forge-std/=lib/forge-std/src/"
]

[profile.conditional-tokens]
src = "conditional-tokens/contracts"
test = "conditional-tokens/contracts"
script = "conditional-tokens/contracts"
out = "out/conditional-tokens"
libs = ["lib"]
cache_path = "cache/conditional-tokens"
solc_version = "0.5.17"
evm_version = "istanbul"
optimizer = false
via_ir = false
bytecode_hash = "ipfs"
remappings = [
	"openzeppelin-solidity/=lib/openzeppelin-solidity/"
]

[profile.security.fuzz]
runs = 256

[profile.security.invariant]
runs = 32
depth = 256
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fuzz]
runs = 12

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
